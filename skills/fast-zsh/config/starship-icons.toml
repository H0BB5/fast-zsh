# Same as starship.toml plus a branch icon. Needs a Nerd Font set in the terminal profile
# (install with --icons, then pick "JetBrainsMono Nerd Font Mono" in the terminal's font setting).
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 500
scan_timeout = 30

format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[character]
success_symbol = "[⚡➜](bold green) "
error_symbol = "[⚡➜](bold red) "

[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = " "
format = "[\\(](blue)[$symbol$branch]($style)[\\)](blue) "
style = "bold magenta"
truncation_length = 36
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

# Everything below probes the filesystem (and often forks the tool) on every prompt. Off.
[package]
disabled = true
[docker_context]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[java]
disabled = true
